[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-guard-lite"
version = "0.1.0"
description = "Evidence-based CMS access checks with a Korean research report"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cms-guard = "cms_guard.__main__:main"

[tool.setuptools.packages.find]
include = ["cms_guard*"]
